name: Sync to Hugging Face
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://Aungnue546:$HF_TOKEN@huggingface.co/spaces/Aungnue546/nexusmind-sovereign
          git push --force space master:main
